name: color_match_game
description: Rengi aklında tut, en yakın kartlar arasından aynısını bul. Sonsuz modlu renk hafıza oyunu.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/logo/logo.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo/icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#12141C"
  adaptive_icon_foreground: "assets/logo/icon_foreground.png"
